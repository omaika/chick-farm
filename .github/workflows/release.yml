name: Release

on:
  push:
    tags: ["v*"]
  # A manual run on main releases its head as the given tag, creating the tag when it is missing.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (v1.2.3); CHANGELOG.md needs its section
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test -race ./...
      - run: node --test extensions/pi/*.test.mjs
      - name: Paseo plugin
        working-directory: extensions/paseo
        run: npm ci --ignore-scripts && npm run typecheck && npm test

  windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      - run: node --test extensions/pi/*.test.mjs
        shell: bash

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: [test, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = windows ]; then ext=.exe; fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/sting8k/piggery/internal/cli.Version=${TAG}" \
            -o "dist/piggery-${GOOS}-${GOARCH}${ext}" ./cmd/piggery
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piggery-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance
      attestations: write  # store the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        # The tag's section of CHANGELOG.md: from "## <tag> " up to the next "## ".
        run: |
          awk -v h="## ${TAG} " 'index($0, h) == 1 {f = 1; next} f && /^## / {exit} f && (s || NF) {s = 1; print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${TAG}"; exit 1; }
      - name: Checksums
        run: cd dist && sha256sum piggery-* > checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/piggery-*
      - name: Tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main || { echo "a manual release runs on main"; exit 1; }
          case "${TAG}" in v[0-9]*) ;; *) echo "tag ${TAG}: want v<version>"; exit 1;; esac
          if sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq .object.sha 2>/dev/null); then
            test "$sha" = "${GITHUB_SHA}" || { echo "${TAG} exists at $sha, not ${GITHUB_SHA}"; exit 1; }
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}"
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes-file notes.md --verify-tag
