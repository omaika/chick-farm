name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: Which jobs to run
        type: choice
        options: [all, windows, unix]
        default: all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    # A manual run may pick only Windows; a push or pull request runs everything.
    if: github.event_name != 'workflow_dispatch' || inputs.os != 'windows'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test -race ./...
      - run: node --test extensions/pi/*.test.mjs
      - name: Paseo plugin
        working-directory: extensions/paseo
        run: npm ci --ignore-scripts && npm run typecheck && npm test
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Windows: build and vet must pass. The test suite is still being ported (many tests drive
  # POSIX shells, signals and file modes), so its failures are reported without failing CI.
  windows:
    name: Windows
    if: github.event_name != 'workflow_dispatch' || inputs.os != 'unix'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
        continue-on-error: true
      - run: node --test extensions/pi/*.test.mjs
        shell: bash
        continue-on-error: true
