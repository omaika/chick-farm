# supervisor + executors.
# The supervisor splits work and spawns executor workers. Every role talks with `send`; routing is
# the fence: an executor reaches only the supervisor. The prompts say how to hand a task back (a
# `send` with kind handback) and that questioning the task mid-way is welcome. The review loop is
# the supervisor reading the handback and replying with kind=rework, or closing. No extra state.
template: supervisor-executor
summary: A supervisor splits a goal (code, research, writing, operations…) into checkable tasks and judges each; executors do them, in parallel only when that helps.
when_to_use:             # selection criteria: the templates action lists them
  - The goal splits into tasks, each with a check that proves it done.
  - Every result should be judged (accepted, reworked or dropped) by one supervisor.
  - You are not sure which template fits (it is the default).
when_not_to_use:
  - The work is several lanes, each needing its own plan, branch and integration (slp).
  - The goal is one decision that needs independent opinions (council).
auto_join_role: supervisor   # the founder's role when a session founds a team from this template
roles:
  supervisor:
    description: Splits the goal into checkable tasks, gives them to executors (a new executor only for parallel work), and accepts, reworks or drops each.
    instructions_file: prompts/supervisor.md   # inlined by `piggery --admin team up`
    tools: [send, inbox, who, agent]
    can_spawn: [executor]
    can_pin: false
    can_set_cwd: false
    spawn:                 # how piggery starts this role's workers
      harness: inherit       # inherit: the main session's harness, else config.yaml harness
      model: inherit         # inherit: harness profile, else the main session's (same harness), else harness default
      thinking: inherit      # inherit: same chain as model
      allow_tools: []      # native tools the harness profile turns off that this role keeps
  executor:
    description: Does its tasks one at a time, checks each, and hands each back to the supervisor (or asks).
    instructions_file: prompts/executor.md
    tools: [send, inbox, who]
    can_spawn: []
    can_pin: false
    can_set_cwd: false
    spawn:                 # how piggery starts this role's workers
      harness: inherit       # inherit: the main session's harness, else config.yaml harness
      model: inherit         # inherit: harness profile, else the main session's (same harness), else harness default
      thinking: inherit      # inherit: same chain as model
      allow_tools: []      # native tools the harness profile turns off that this role keeps
routing:
  - {from: supervisor, to: executor, allow: true, cc: []}
  - {from: executor, to: supervisor, allow: true, cc: []}
timers:                  # one condition each; escalate_to: told again when the incident outlasts the notice
  - {on: executor, notify: reports_to, silent_for: 20m}
  - {on: executor, notify: reports_to, idle_with_task_for: 10m}
  - {on: executor, notify: reports_to, max_rework: 3, escalate_to: notify}
  - {on: supervisor, notify: self, unanswered_for: 30m, escalate_to: notify}
limits:                  # none: no limit
  depth: 2                 # how deep spawned_by chains may go
  concurrency: 10           # live workers at once
  messages_per_participant_per_minute: 30
  max_respawn_per_hour: none
